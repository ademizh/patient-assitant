[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Show only the exception type in the browser (no full messages/tracebacks that could echo patient text).
showErrorDetails = "type"
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 50
# Serves ./static (bundled fonts) - the app works offline and makes no requests to font services.
enableStaticServing = true

# ---- Design: light, friendly "Medical.kz" style -----------------------------------------------
[theme]
base = "light"
primaryColor = "#1E86D4"            # buttons, links, active elements (sky blue, readable with white text)
backgroundColor = "#F6F9FE"         # very light blue page background
secondaryBackgroundColor = "#EAF4FD"
textColor = "#1F2A37"
linkColor = "#1E86D4"
borderColor = "#DCE8F5"
showWidgetBorder = true
baseRadius = "0.9rem"
buttonRadius = "full"               # pill-shaped buttons
font = "Nunito, sans-serif"
headingFont = "Playfair Display, serif"
headingFontWeights = [700, 700, 700, 700, 600, 600]
baseFontSize = 15
blueColor = "#1E86D4"
blueBackgroundColor = "#EAF4FD"
blueTextColor = "#11578F"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F8FE"
borderColor = "#E3ECF7"

[[theme.fontFaces]]
family = "Nunito"
url = "app/static/fonts/nunito-cyrillic-400-normal.woff2"
weight = "400"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[[theme.fontFaces]]
family = "Nunito"
url = "app/static/fonts/nunito-latin-400-normal.woff2"
weight = "400"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

